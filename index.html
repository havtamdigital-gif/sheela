<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheela — Ask a Question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="brand">
      <h1>Sheela</h1>
      <div class="tagline">Live Lecture Q&amp;A</div>
      <div class="flourish">✿ ✿ ✿</div>
    </header>

    <div class="card">
      <form id="question-form" novalidate>
        <label for="name">Your name <span class="optional">(optional)</span></label>
        <input type="text" id="name" maxlength="60" placeholder="Anonymous" autocomplete="name">

        <label for="question">Your question</label>
        <textarea id="question" maxlength="500" required placeholder="What would you like to ask?"></textarea>
        <div class="char-count"><span id="chars">0</span>/500</div>
        <div class="error-msg" id="error-msg"></div>

        <button type="submit" class="btn" id="submit-btn">Send question</button>
      </form>

      <div class="success" id="success">
        <div class="icon">🌸</div>
        <p>Thank you, your question was sent.</p>
        <button class="again" id="ask-again">Ask another question</button>
      </div>
    </div>

    <p class="footer-note">Your question goes directly to the speaker.<br>Leave the name field empty to stay anonymous.</p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
