<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheela Li — Live Q&A</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card2: #232736;
    --accent: #7c5cff;
    --accent2: #9d85ff;
    --text: #e8e9ee;
    --muted: #9aa0b0;
    --green: #34c98e;
    --red: #ff6b6b;
    --amber: #f5b944;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  h2 { font-size: 1.25rem; margin-bottom: 12px; }
  h3 { font-size: 1rem; margin-bottom: 8px; color: var(--muted); }
  .sub { color: var(--muted); margin-bottom: 24px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent2); }
  .btn.secondary { background: var(--card2); color: var(--text); }
  .btn.danger { background: var(--red); }
  .btn.green { background: var(--green); }
  .btn.small { padding: 7px 14px; font-size: .85rem; }
  .btn.block { display: block; width: 100%; text-align: center; }
  .btn:disabled { opacity: .5; cursor: default; }
  input[type="text"], textarea {
    width: 100%;
    background: var(--card2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 1rem;
    margin-bottom: 12px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); }
  textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  .code-display {
    font-size: 3.5rem;
    font-weight: 800;
    letter-spacing: .35em;
    text-align: center;
    color: var(--accent2);
    padding: 10px 0 10px .35em;
  }
  #qrcode { display: flex; justify-content: center; padding: 16px; background: #fff; border-radius: 10px; width: fit-content; margin: 0 auto 8px; }
  .question {
    background: var(--card2);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .qnum {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    border-radius: 8px;
    min-width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .85rem;
    flex-shrink: 0;
  }
  .qbody { flex: 1; }
  .qtext { margin-bottom: 6px; line-height: 1.4; }
  .qmeta { font-size: .78rem; color: var(--muted); }
  .qactions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .question.answered { opacity: .55; }
  .question.answered .qnum { background: var(--green); }
  .question.pending-mod { border-left: 3px solid var(--amber); }
  .votebtn {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: .85rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .votebtn.voted { background: var(--accent); border-color: var(--accent); }
  .votebtn:disabled { opacity: .6; cursor: default; }
  .pill {
    display: inline-block;
    font-size: .72rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    background: var(--card2);
    color: var(--muted);
  }
  .pill.live { background: rgba(52,201,142,.15); color: var(--green); }
  .pill.ended { background: rgba(255,107,107,.15); color: var(--red); }
  .pill.pending { background: rgba(245,185,68,.15); color: var(--amber); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .back { color: var(--muted); text-decoration: none; font-size: .9rem; display: inline-block; margin-bottom: 16px; cursor: pointer; }
  .back:hover { color: var(--text); }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .role-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .role-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .role-card .emoji { font-size: 2rem; margin-bottom: 8px; }
  .role-card .desc { font-size: .8rem; color: var(--muted); margin-top: 4px; }
  .session-row { cursor: pointer; }
  .session-row:hover { border-color: var(--accent); }
  .code-input { text-transform: uppercase; letter-spacing: .3em; text-align: center; font-size: 1.5rem; font-weight: 700; }
  .divider { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 18px 0; }
  .notice { font-size: .8rem; color: var(--muted); line-height: 1.5; margin-top: 10px; }
  .banner {
    background: rgba(245,185,68,.12);
    border: 1px solid rgba(245,185,68,.3);
    color: var(--amber);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: .82rem;
    margin-bottom: 16px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
/* ============================================================
   CONFIG — set FIREBASE_DB_URL to your Firebase Realtime
   Database URL (e.g. "https://Sheela Li-xxxxx-default-rtdb.firebaseio.com")
   to enable real cross-device sync. Leave empty to fall back to
   localStorage (same-browser tabs only, good for local demos).
   ============================================================ */
const FIREBASE_DB_URL = "https://Sheela Li-54145-default-rtdb.firebaseio.com";

/* SHA-256 hash of the admin passcode — change by hashing a new code */
const ADMIN_PIN_HASH = "3149445257c74613d52f427610652e64f57299006bef4c000565f8042de76175";

const USING_FIREBASE = !!FIREBASE_DB_URL;
const STORE_KEY = 'Sheela Li-data-v2';

/* client identity for one-vote-per-person */
let CLIENT_ID = localStorage.getItem('Sheela Li-client-id');
if (!CLIENT_ID) {
  CLIENT_ID = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('Sheela Li-client-id', CLIENT_ID);
}

/* ============ storage adapter ============ */
async function fb(path, method = 'GET', body) {
  const res = await fetch(FIREBASE_DB_URL + '/' + path + '.json', {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (!res.ok) throw new Error('Storage error ' + res.status);
  return res.json();
}
function lsLoad() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { sessions: {} }; }
  catch { return { sessions: {} }; }
}
function lsSave(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); }

const store = {
  async createSession(title, speaker) {
    let code, exists;
    do {
      code = Array.from({length: 4}, () =>
        'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
      exists = await this.getSession(code);
    } while (exists);
    const s = { code, title, speaker: speaker || '', createdAt: Date.now(), ended: false, questions: {} };
    if (USING_FIREBASE) await fb('sessions/' + code, 'PUT', s);
    else { const d = lsLoad(); d.sessions[code] = s; lsSave(d); }
    return code;
  },
  async getSession(code) {
    code = (code || '').toUpperCase();
    if (!code) return null;
    if (USING_FIREBASE) return await fb('sessions/' + code);
    return lsLoad().sessions[code] || null;
  },
  async listSessions() {
    if (USING_FIREBASE) { const all = await fb('sessions'); return all ? Object.values(all) : []; }
    return Object.values(lsLoad().sessions);
  },
  async addQuestion(code, text, name) {
    const id = 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const q = { id, text, name: name || '', createdAt: Date.now(), status: 'pending', answered: false, votes: {} };
    if (USING_FIREBASE) await fb('sessions/' + code + '/questions/' + id, 'PUT', q);
    else { const d = lsLoad(); (d.sessions[code].questions ||= {})[id] = q; lsSave(d); }
    return id;
  },
  async patchQuestion(code, qid, patch) {
    if (USING_FIREBASE) await fb('sessions/' + code + '/questions/' + qid, 'PATCH', patch);
    else { const d = lsLoad(); Object.assign(d.sessions[code].questions[qid], patch); lsSave(d); }
  },
  async vote(code, qid) {
    if (USING_FIREBASE) await fb('sessions/' + code + '/questions/' + qid + '/votes/' + CLIENT_ID, 'PUT', true);
    else { const d = lsLoad(); (d.sessions[code].questions[qid].votes ||= {})[CLIENT_ID] = true; lsSave(d); }
  },
  async unvote(code, qid) {
    if (USING_FIREBASE) await fb('sessions/' + code + '/questions/' + qid + '/votes/' + CLIENT_ID, 'DELETE');
    else { const d = lsLoad(); delete (d.sessions[code].questions[qid].votes || {})[CLIENT_ID]; lsSave(d); }
  },
  async endSession(code) {
    if (USING_FIREBASE) await fb('sessions/' + code, 'PATCH', { ended: true });
    else { const d = lsLoad(); d.sessions[code].ended = true; lsSave(d); }
  }
};

/* ============ helpers ============ */
function qlist(s) {
  return Object.values(s.questions || {}).map(q => ({ ...q, votes: q.votes || {} }))
    .sort((a, b) => a.createdAt - b.createdAt);
}
function voteCount(q) { return Object.keys(q.votes || {}).length; }
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function esc(str) {
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ router / state ============ */
const app = document.getElementById('app');
let state = { view: 'home', code: null, myQuestions: JSON.parse(localStorage.getItem('Sheela Li-mine') || '[]') };
let pollTimer = null;

function rememberMine(qid) {
  state.myQuestions.push(qid);
  localStorage.setItem('Sheela Li-mine', JSON.stringify(state.myQuestions));
}
async function requireAdmin() {
  if (sessionStorage.getItem('Sheela Li-admin-ok') === '1') return true;
  const pin = prompt('Admin passcode:');
  if (pin === null) return false;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin.trim()));
  const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  if (hex === ADMIN_PIN_HASH) { sessionStorage.setItem('Sheela Li-admin-ok', '1'); return true; }
  alert('Wrong passcode.');
  return false;
}
async function nav(view, code) {
  if ((view === 'admin' || view === 'admin-session') && !(await requireAdmin())) return;
  state.view = view;
  if (code !== undefined) state.code = code;
  render();
}
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (['speaker-live', 'participant', 'admin', 'admin-session'].includes(state.view)) render(true);
  }, 3000);
}
window.addEventListener('storage', e => { if (e.key === STORE_KEY) render(true); });

/* ============ views ============ */
async function render(isRefresh) {
  const v = state.view;
  try {
    if (v === 'home') return renderHome();
    if (v === 'speaker-new') return renderSpeakerNew();
    if (v === 'speaker-live') return await renderSpeakerLive();
    if (v === 'join') return renderJoin();
    if (v === 'participant') return await renderParticipant(isRefresh);
    if (v === 'admin') return await renderAdmin();
    if (v === 'admin-session') return await renderAdminSession();
  } catch (err) {
    if (!isRefresh) app.innerHTML = `<div class="card empty">Connection problem — retrying…<br><span class="qmeta">${esc(err.message)}</span></div>`;
    startPolling();
  }
}

function storageBanner() {
  return USING_FIREBASE ? '' :
    `<div class="banner">Demo mode: data only syncs between tabs on this browser. Configure FIREBASE_DB_URL in index.html for real cross-device sync.</div>`;
}

function renderHome() {
  app.innerHTML = `
    <h1>Sheela Li</h1>
    <p class="sub">Live audience Q&amp;A for talks and lectures</p>
    ${storageBanner()}
    <div class="role-grid">
      <div class="role-card" onclick="nav('speaker-new')">
        <div class="emoji">🎤</div><strong>Speaker</strong>
        <div class="desc">Start a session and take questions</div>
      </div>
      <div class="role-card" onclick="nav('join')">
        <div class="emoji">🙋</div><strong>Participant</strong>
        <div class="desc">Join with a code and ask</div>
      </div>
    </div>
    <hr class="divider">
    <a class="back" onclick="nav('admin')">Admin view →</a>
    <p class="notice">Note: sessions and questions live in shared storage — anyone using this app can see them. New questions are held for admin approval before the speaker sees them.</p>`;
}

function renderSpeakerNew() {
  app.innerHTML = `
    <a class="back" onclick="nav('home')">← Back</a>
    <h2>New session</h2>
    <div class="card">
      <label>Talk title</label>
      <input type="text" id="f-title" placeholder="e.g. Intro to Machine Learning" maxlength="120">
      <label>Your name (optional)</label>
      <input type="text" id="f-speaker" placeholder="e.g. Dr. Levi" maxlength="60">
      <button class="btn block" id="b-create" onclick="doCreate()">Create session</button>
    </div>`;
  document.getElementById('f-title').focus();
}
async function doCreate() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Please enter a talk title.'); return; }
  const speaker = document.getElementById('f-speaker').value.trim();
  document.getElementById('b-create').disabled = true;
  const code = await store.createSession(title, speaker);
  nav('speaker-live', code);
}

async function renderSpeakerLive() {
  const s = await store.getSession(state.code);
  if (!s) return nav('home');
  const qs = qlist(s);
  const open = qs.filter(q => q.status === 'approved' && !q.answered)
    .sort((a, b) => voteCount(b) - voteCount(a) || a.createdAt - b.createdAt);
  const done = qs.filter(q => q.answered);
  const pendingCount = qs.filter(q => q.status === 'pending').length;
  const joinUrl = location.origin + location.pathname + '?join=' + s.code;
  app.innerHTML = `
    <a class="back" onclick="nav('home')">← Home</a>
    <div class="row" style="margin-bottom:8px">
      <h2 style="margin:0">${esc(s.title)}</h2>
      <span class="pill ${s.ended ? 'ended' : 'live'}">${s.ended ? 'Ended' : 'Live'}</span>
    </div>
    ${s.speaker ? `<p class="sub">by ${esc(s.speaker)}</p>` : ''}
    <div class="card">
      <div class="code-display">${s.code}</div>
      <div id="qrcode"></div>
      <p class="notice" style="text-align:center">Scan to join, or enter the code at this page</p>
    </div>
    ${pendingCount ? `<div class="banner">${pendingCount} question${pendingCount === 1 ? '' : 's'} awaiting admin approval</div>` : ''}
    <div class="card">
      <h2>Questions (${open.length})</h2>
      ${open.length ? open.map(q => `
        <div class="question">
          <div class="qnum">▲${voteCount(q)}</div>
          <div class="qbody">
            <div class="qtext">${esc(q.text)}</div>
            <div class="qmeta">${esc(q.name) || 'Anonymous'} · ${timeAgo(q.createdAt)}</div>
          </div>
          <button class="btn small secondary" onclick="doAnswer('${q.id}')">Answered</button>
        </div>`).join('') : '<div class="empty">No approved questions yet — the feed refreshes automatically.</div>'}
      ${done.length ? `<hr class="divider"><h2>Answered (${done.length})</h2>` + done.map(q => `
        <div class="question answered">
          <div class="qnum">✓</div>
          <div class="qbody">
            <div class="qtext">${esc(q.text)}</div>
            <div class="qmeta">${esc(q.name) || 'Anonymous'} · ${timeAgo(q.createdAt)}</div>
          </div>
        </div>`).join('') : ''}
    </div>
    ${!s.ended ? `<button class="btn danger block" onclick="doEnd()">End session</button>` : ''}`;
  new QRCode(document.getElementById('qrcode'), { text: joinUrl, width: 140, height: 140 });
  startPolling();
}
async function doAnswer(qid) { await store.patchQuestion(state.code, qid, { answered: true }); render(); }
async function doEnd() { if (confirm('End this session?')) { await store.endSession(state.code); render(); } }

function renderJoin() {
  app.innerHTML = `
    <a class="back" onclick="nav('home')">← Back</a>
    <h2>Join a session</h2>
    <div class="card">
      <label>Session code</label>
      <input type="text" id="f-code" class="code-input" maxlength="4" placeholder="ABCD" autocomplete="off">
      <button class="btn block" onclick="doJoin()">Join</button>
    </div>`;
  const inp = document.getElementById('f-code');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); });
}
async function doJoin() {
  const code = document.getElementById('f-code').value.trim().toUpperCase();
  if (!(await store.getSession(code))) { alert('No session found with that code.'); return; }
  nav('participant', code);
}

async function renderParticipant(isRefresh) {
  const s = await store.getSession(state.code);
  if (!s) return nav('home');
  const prevQ = document.getElementById('f-q')?.value || '';
  const prevN = document.getElementById('f-name')?.value || '';
  const qs = qlist(s);
  const board = qs.filter(q => q.status === 'approved' && !q.answered)
    .sort((a, b) => voteCount(b) - voteCount(a) || a.createdAt - b.createdAt);
  const mine = qs.filter(q => state.myQuestions.includes(q.id));
  app.innerHTML = `
    <a class="back" onclick="nav('home')">← Leave</a>
    <div class="row" style="margin-bottom:8px">
      <h2 style="margin:0">${esc(s.title)}</h2>
      <span class="pill ${s.ended ? 'ended' : 'live'}">${s.ended ? 'Ended' : 'Live'}</span>
    </div>
    ${s.speaker ? `<p class="sub">by ${esc(s.speaker)}</p>` : ''}
    ${!s.ended ? `
    <div class="card">
      <label>Your question</label>
      <textarea id="f-q" placeholder="Type your question…" maxlength="500"></textarea>
      <label>Your name (optional — blank = anonymous)</label>
      <input type="text" id="f-name" maxlength="60" placeholder="Anonymous">
      <button class="btn block" onclick="doAsk()">Send question</button>
      <p class="notice">Questions appear after admin approval.</p>
    </div>` : '<div class="card empty">This session has ended.</div>'}
    ${board.length ? `<div class="card"><h2>Question board</h2>` + board.map(q => {
      const voted = q.votes[CLIENT_ID];
      return `
      <div class="question">
        <div class="qbody">
          <div class="qtext">${esc(q.text)}</div>
          <div class="qmeta">${esc(q.name) || 'Anonymous'} · ${timeAgo(q.createdAt)}</div>
        </div>
        <button class="votebtn ${voted ? 'voted' : ''}" ${s.ended ? 'disabled' : ''} onclick="doVote('${q.id}', ${!!voted})">▲ ${voteCount(q)}</button>
      </div>`;
    }).join('') + '</div>' : ''}
    ${mine.length ? `<div class="card"><h2>Your questions</h2>` + mine.map(q => {
      const label = q.answered ? 'Answered' :
        q.status === 'pending' ? 'Awaiting approval' :
        q.status === 'rejected' ? 'Not approved' : 'On the board';
      return `
      <div class="question ${q.answered ? 'answered' : ''} ${q.status === 'pending' ? 'pending-mod' : ''}">
        <div class="qnum">${q.answered ? '✓' : q.status === 'pending' ? '⏳' : q.status === 'rejected' ? '✕' : '▲' + voteCount(q)}</div>
        <div class="qbody">
          <div class="qtext">${esc(q.text)}</div>
          <div class="qmeta">${label} · ${timeAgo(q.createdAt)}</div>
        </div>
      </div>`;
    }).join('') + '</div>' : ''}`;
  if (isRefresh) {
    document.getElementById('f-q') && (document.getElementById('f-q').value = prevQ);
    document.getElementById('f-name') && (document.getElementById('f-name').value = prevN);
  }
  startPolling();
}
async function doAsk() {
  const text = document.getElementById('f-q').value.trim();
  if (!text) { alert('Please type a question.'); return; }
  const name = document.getElementById('f-name').value.trim();
  const s = await store.getSession(state.code);
  if (!s || s.ended) { alert('This session has ended.'); render(); return; }
  const qid = await store.addQuestion(state.code, text, name);
  rememberMine(qid);
  render();
}
async function doVote(qid, alreadyVoted) {
  if (alreadyVoted) await store.unvote(state.code, qid);
  else await store.vote(state.code, qid);
  render();
}

async function renderAdmin() {
  const sessions = (await store.listSessions()).sort((a, b) => b.createdAt - a.createdAt);
  app.innerHTML = `
    <a class="back" onclick="nav('home')">← Home</a>
    <h2>All sessions</h2>
    ${sessions.length ? sessions.map(s => {
      const qs = qlist(s);
      const pending = qs.filter(q => q.status === 'pending').length;
      return `
      <div class="card session-row" onclick="nav('admin-session', '${s.code}')">
        <div class="row">
          <div>
            <strong>${esc(s.title)}</strong>
            <div class="qmeta" style="margin-top:4px">${s.code} · ${esc(s.speaker) || 'No speaker name'} · ${qs.length} question${qs.length === 1 ? '' : 's'} · ${timeAgo(s.createdAt)}</div>
          </div>
          <div>
            ${pending ? `<span class="pill pending">${pending} to review</span> ` : ''}
            <span class="pill ${s.ended ? 'ended' : 'live'}">${s.ended ? 'Ended' : 'Live'}</span>
          </div>
        </div>
      </div>`;
    }).join('') : '<div class="empty">No sessions yet.</div>'}`;
  startPolling();
}

async function renderAdminSession() {
  const s = await store.getSession(state.code);
  if (!s) return nav('admin');
  const qs = qlist(s);
  const pending = qs.filter(q => q.status === 'pending');
  const rest = qs.filter(q => q.status !== 'pending');
  app.innerHTML = `
    <a class="back" onclick="nav('admin')">← All sessions</a>
    <div class="row" style="margin-bottom:8px">
      <h2 style="margin:0">${esc(s.title)}</h2>
      <span class="pill ${s.ended ? 'ended' : 'live'}">${s.ended ? 'Ended' : 'Live'}</span>
    </div>
    <p class="sub">${s.code}${s.speaker ? ' · ' + esc(s.speaker) : ''}</p>
    <div class="card">
      <h2>Awaiting approval (${pending.length})</h2>
      ${pending.length ? pending.map(q => `
        <div class="question pending-mod">
          <div class="qbody">
            <div class="qtext">${esc(q.text)}</div>
            <div class="qmeta">${esc(q.name) || 'Anonymous'} · ${timeAgo(q.createdAt)}</div>
          </div>
          <div class="qactions">
            <button class="btn small green" onclick="doModerate('${q.id}', 'approved')">Approve</button>
            <button class="btn small danger" onclick="doModerate('${q.id}', 'rejected')">Reject</button>
          </div>
        </div>`).join('') : '<div class="empty">Nothing waiting for review.</div>'}
    </div>
    <div class="card">
      <h2>All questions (${rest.length})</h2>
      ${rest.length ? rest.map((q, i) => `
        <div class="question ${q.answered ? 'answered' : ''}">
          <div class="qnum">${q.answered ? '✓' : q.status === 'rejected' ? '✕' : '▲' + voteCount(q)}</div>
          <div class="qbody">
            <div class="qtext">${esc(q.text)}</div>
            <div class="qmeta">${esc(q.name) || 'Anonymous'} · ${q.answered ? 'Answered' : q.status === 'rejected' ? 'Rejected' : 'On the board'} · ${timeAgo(q.createdAt)}</div>
          </div>
        </div>`).join('') : '<div class="empty">No moderated questions yet.</div>'}
    </div>`;
  startPolling();
}
async function doModerate(qid, status) {
  await store.patchQuestion(state.code, qid, { status });
  render();
}

/* ============ init: QR deep-link ============ */
(async () => {
  const joinCode = new URLSearchParams(location.search).get('join');
  if (joinCode && await store.getSession(joinCode)) {
    state.code = joinCode.toUpperCase();
    state.view = 'participant';
  }
  render();
})();
</script>
</body>
</html>
