<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheela Li — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin">
  <div class="container">
    <header class="brand">
      <h1>Sheela Li</h1>
      <div class="tagline">Creator Admin — all sessions</div>
    </header>

    <div class="stats-bar">
      <h2>Overview</h2>
      <span class="count"><span id="session-count">0</span> sessions · <span id="question-count">0</span> questions</span>
    </div>

    <div id="session-list">
      <div class="empty-state">
        <div class="icon">🌸</div>
        No sessions yet.
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
