<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheela Li — Speaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="admin">
  <div class="container">
    <header class="brand">
      <h1>Sheela Li</h1>
      <div class="tagline" id="talk-line">Speaker Dashboard</div>
    </header>

    <div class="card qr-card">
      <h2 id="talk-title-heading">Scan to ask a question</h2>
      <div class="hint">Display this screen to your audience — or share the code</div>
      <div class="code-display" id="code-display"></div>
      <div id="qrcode"></div>
      <div class="url" id="join-url"></div>
    </div>

    <div class="stats-bar">
      <h2>Questions &amp; Audience Insights</h2>
      <span class="count"><span id="count">0</span> total</span>
    </div>

    <div id="question-list">
      <div class="empty-state">
        <div class="icon">🌸</div>
        Waiting for the first question…
      </div>
    </div>

    <button class="btn danger-btn" id="end-btn">End session</button>
  </div>

  <script type="module" src="speaker.js"></script>
</body>
</html>
